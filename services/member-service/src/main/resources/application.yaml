# 멤버 서비스 기본 설정. 비밀값은 파일(configtree)로만 받는다: docs/common/security.md, docs/common/local-development.md
# 비밀값 위치는 환경변수로 받는다(없으면 기동하지 않는다).
# - TASK_SECRETS_DIR: 설정 파일 폴더(파일 이름 = 속성 이름). 절대 경로로 준다(configtree는 '..'이 든 경로를 읽지 못한다).
# - TASK_INTERNAL_SECRETS_DIR: 내부 호출 키 폴더(컨테이너는 TASK_SECRETS_DIR와 같음).
# bootRun은 저장소 secrets/ 의 절대 경로를, 컨테이너는 Compose secrets 의 /run/secrets 를 넣는다.
spring:
  application:
    name: member-service
  config:
    import: "optional:configtree:${TASK_SECRETS_DIR}/,optional:configtree:${TASK_INTERNAL_SECRETS_DIR:${TASK_SECRETS_DIR}}/"
  datasource:
    url: jdbc:mariadb://${MEMBER_DB_HOST:localhost}:${MEMBER_DB_PORT:13306}/member_service
    username: member_app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration/mariadb
    schemas: member_service
    default-schema: member_service
    create-schemas: false
  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 100
        # Page 응답 JSON 형식 고정(Spring Data PagedModel)
        serialization-mode: via-dto
server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # 준비 상태는 자기 DB만 본다. 다른 서비스의 상태는 넣지 않는다.
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

task:
  security:
    # 접근 토큰 검증(POL-SEC-001). 공개키는 configtree 파일 task.security.jwt.public-key(generateLocalSecrets 생성)로 받는다.
    jwt:
      issuer: ${TASK_JWT_ISSUER:task-local}
      audience: member-service
      clock-skew: 30s
  # 인증된 호출자(sub)별 토큰 버킷(POL-SEC-007)
  rate-limit:
    enabled: true
    capacity: 100
    refill-per-second: 50
  # 그룹 API Swagger 실행 중계(POL-SEC-006). 운영 기본은 꺼짐, local 프로필에서만 켠다.
  group-proxy:
    enabled: false
  group-membership:
    source: ${TASK_GROUP_MEMBERSHIP_SOURCE:http}
  group-client:
    base-url: ${TASK_GROUP_CLIENT_BASE_URL:}
    connect-timeout: 2s
    read-timeout: 3s
    max-retries: 1
    retry-base-delay: 200ms
    retry-max-delay: 2s

logging:
  level:
    root: INFO
  pattern:
    level: "%5p [service:%X{service} request:%X{requestId} call:%X{callId} attempt:%X{attempt}]"

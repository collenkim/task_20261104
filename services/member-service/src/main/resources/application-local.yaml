# IDE·bootRun 기본 그룹 주소. 컨테이너는 Compose가 내부 IP를 지정한다.
spring:
  flyway:
    locations:
      - classpath:db/migration/mariadb
      - classpath:db/seed/local
task:
  security:
    # Swagger 자동 인증 토큰(POL-SEC-005). 서명 키는 configtree 파일 task.security.local-token.signing-key.
    local-token:
      ttl: 30m
  group-proxy:
    enabled: true
  group-membership:
    source: ${TASK_GROUP_MEMBERSHIP_SOURCE:fixture}
  group-client:
    base-url: ${TASK_GROUP_CLIENT_BASE_URL:http://127.0.0.1:8082}

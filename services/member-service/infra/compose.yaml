# 멤버 서비스 단독 실행 구성(Compose 프로젝트 task-member). 그룹 서비스와 리소스를 공유하지 않는다.
# 명령은 서비스 폴더(services/member-service) 기준이다. 저장소 루트에서는 -f services/member-service/infra/compose.yaml 로 바꾼다.
#   DB만:     docker compose -f infra/compose.yaml up -d                        (앱은 ../../gradlew bootRun)
#   앱 + DB:  ../../gradlew bootJar 후 docker compose -f infra/compose.yaml --profile app up -d --build
#   종료:     docker compose -f infra/compose.yaml --profile app down          (볼륨은 지우지 않는다)
# 파일 안의 상대 경로(build context, initdb, secrets)는 이 파일 위치(infra/) 기준이라 실행 폴더와 관계없다.
# 비밀값은 저장소 secrets/ 의 파일을 Compose secrets 로 마운트한다(값을 환경변수·이 파일에 쓰지 않음).
# 먼저 ../../gradlew :generateLocalSecrets (루트에서는 ./gradlew generateLocalSecrets)를 실행한다.
name: task-member

services:
  member-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: member_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/member_db_admin_password
    secrets:
      - member_db_admin_password
      - member_db_app_password
    volumes:
      - member-db-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - member-db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d member_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped

  member-service:
    profiles: ["app"]
    build:
      context: ..
    image: task/member-service:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      MEMBER_DB_HOST: member-db
      MEMBER_DB_PORT: "5432"
      TASK_SECRETS_DIR: /run/secrets
      TASK_JWT_PUBLIC_KEY: /run/secrets/jwt-public-key.pem
    secrets:
      - source: member_db_app_password
        target: spring.datasource.password
      - source: member_swagger_token
        target: task.security.swagger-token
      - source: jwt_public_key
        target: jwt-public-key.pem
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - member-db-net
    depends_on:
      member-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  member-db-data:

networks:
  member-db-net:

secrets:
  member_db_admin_password:
    file: ../../../secrets/member-service/db-admin-password
  member_db_app_password:
    file: ../../../secrets/member-service/config/spring.datasource.password
  member_swagger_token:
    file: ../../../secrets/member-service/config/task.security.swagger-token
  jwt_public_key:
    file: ../../../secrets/jwt/public-key.pem

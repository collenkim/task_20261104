# 그룹 서비스 기본 설정. 비밀값은 파일(configtree)로만 받는다: docs/common/security.md, docs/common/local-development.md
# 비밀값 위치는 환경변수로 받는다(없으면 기동하지 않는다).
# - TASK_SECRETS_DIR: 설정 파일 폴더(파일 이름 = 속성 이름). 절대 경로로 준다(configtree는 '..'이 든 경로를 읽지 못한다).
# - TASK_INTERNAL_SECRETS_DIR: 내부 호출 키 폴더(컨테이너는 TASK_SECRETS_DIR와 같음).
# bootRun은 저장소 secrets/ 의 절대 경로를, 컨테이너는 Compose secrets 의 /run/secrets 를 넣는다.
spring:
  application:
    name: group-service
  config:
    import: "optional:configtree:${TASK_SECRETS_DIR}/,optional:configtree:${TASK_INTERNAL_SECRETS_DIR:${TASK_SECRETS_DIR}}/"
  datasource:
    url: jdbc:mariadb://${GROUP_DB_HOST:localhost}:${GROUP_DB_PORT:23306}/group_service
    username: group_app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration/mariadb
    schemas: group_service
    default-schema: group_service
    create-schemas: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        # Page 응답 JSON 형식 고정(Spring Data PagedModel)
        serialization-mode: via-dto
server:
  port: 8082
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # 준비 상태는 자기 DB만 본다. 다른 서비스의 상태는 넣지 않는다.
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
  pattern:
    level: "%5p [service:%X{service} request:%X{requestId} call:%X{callId} attempt:%X{attempt}]"
